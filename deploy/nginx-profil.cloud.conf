# ============================================================
# Konfigurasi profil.cloud (Laravel Multi-Tenant)
# Disusun ulang: 2 server block karena 2 sertifikat berbeda
#   - profil.cloud & www.profil.cloud -> cert base
#   - *.profil.cloud                   -> cert wildcard
# ============================================================

# ---------- Base domain + www (sertifikat base) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name profil.cloud www.profil.cloud;

    root /var/www/profil.cloud/public;
    index index.php index.html;
    charset utf-8;

    access_log /var/log/nginx/profil.cloud-access.log;
    error_log  /var/log/nginx/profil.cloud-error.log error;

    ssl_certificate     /var/www/profil.cloud/letsencrypt/config/live/profil.cloud-0001/fullchain.pem;
    ssl_certificate_key /var/www/profil.cloud/letsencrypt/config/live/profil.cloud-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain text/css text/javascript text/xml application/json
        application/javascript application/xml application/xml+rss
        application/x-javascript application/rss+xml image/svg+xml
        font/ttf font/otf font/woff font/woff2;

    # Aset template pre-generated: cache agresif agar browser tidak refetch
    location ~* ^/storage/images/templates/.*\.(jpg|jpeg|png|webp)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
        access_log off;
    }

    location ~* \.(?:jpg|jpeg|gif|png|ico|webp|avif|svg|css|js|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    location ~ /\.(?!well-known).* { deny all; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300;
    }

    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/500.html;
    location = /error/404.html { internal; root /var/www/profil.cloud; }
    location = /error/500.html { internal; root /var/www/profil.cloud; }
}

# ---------- Wildcard subdomain *.profil.cloud (sertifikat wildcard) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name *.profil.cloud;

    root /var/www/profil.cloud/public;
    index index.php index.html;
    charset utf-8;

    access_log /var/log/nginx/profil.cloud-access.log;
    error_log  /var/log/nginx/profil.cloud-error.log error;

    ssl_certificate     /var/www/profil.cloud/letsencrypt/config/live/profil.cloud/fullchain.pem;
    ssl_certificate_key /var/www/profil.cloud/letsencrypt/config/live/profil.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-javascript
        application/rss+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    location ~* \.(?:jpg|jpeg|gif|png|ico|webp|avif|svg|css|js|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
        access_log off;
    }

    location ~ /\.(?!well-known).* { deny all; }

    location / { try_files $uri $uri/ /index.php?$query_string; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 300;
    }

    error_page 404 /error/404.html;
    error_page 500 502 503 504 /error/500.html;
    location = /error/404.html { internal; root /var/www/profil.cloud; }
    location = /error/500.html { internal; root /var/www/profil.cloud; }
}

# ---------- Redirect HTTP -> HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name profil.cloud www.profil.cloud *.profil.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/profil.cloud;
    }

    return 301 https://$host$request_uri;
}
